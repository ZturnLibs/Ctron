name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make -C compiler-c && sh compiler/build.sh
      - name: glibc 调参缓解矩阵(逐项守卫,死亡即止但日志可读)
        run: |
          echo "== T1: MMAP 阈值 256MB =="
          MALLOC_MMAP_THRESHOLD_=268435456 /usr/bin/time -v sh compiler/ctc.sh emit compiler/build/cc_run.ct /tmp/t1.c 2>&1 | grep -E "Maximum resident|Elapsed" || echo "T1 死亡"
          echo "== T2: MMAP+TRIM 阈值 256MB =="
          MALLOC_MMAP_THRESHOLD_=268435456 MALLOC_TRIM_THRESHOLD_=268435456 /usr/bin/time -v sh compiler/ctc.sh emit compiler/build/cc_run.ct /tmp/t2.c 2>&1 | grep -E "Maximum resident|Elapsed" || echo "T2 死亡"
          echo "== T3: M_ARENA_MAX=1 =="
          MALLOC_ARENA_MAX=1 /usr/bin/time -v sh compiler/ctc.sh emit compiler/build/cc_run.ct /tmp/t3.c 2>&1 | grep -E "Maximum resident|Elapsed" || echo "T3 死亡"
          exit 0
