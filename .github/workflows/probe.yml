name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make -C compiler-c && sh compiler/build.sh
      - name: 修复后 linux 复测(emit 工作负载;C=== 记账, peak RSS 为判据)
        run: |
          echo "== E1: seed emit cc_run.ct(峰值判据;修复前 ~15.4GB OOM) =="
          CTRON_MEM_DEBUG=1 /usr/bin/time -v sh compiler/ctc.sh emit compiler/build/cc_run.ct /tmp/e1.c 2>&1 | grep -E "Maximum resident|Elapsed|MEM total" || echo "E1 死亡"
          echo "== E2: seed emit cc_emit.ct(更大负载) =="
          CTRON_MEM_DEBUG=1 /usr/bin/time -v sh compiler/ctc.sh emit compiler/build/cc_emit.ct /tmp/e2.c 2>&1 | grep -E "Maximum resident|Elapsed|MEM total" || echo "E2 死亡"
          echo "== E3: 双产物固定点(修复前后发射一致性自证) =="
          sh compiler/native.sh > /dev/null 2>&1
          compiler/bin/ctron-emit run compiler/build/cc_run.ct > /tmp/e3_native.c 2>/dev/null
          cmp -s /tmp/e1.c /tmp/e3_native.c && echo "固定点一致" || echo "固定点分歧"
          exit 0
