name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 工具链(gcc/python3)
        run: sudo apt-get update && sudo apt-get install -y gcc python3
      - name: 宿主 seed(首次引导)
        run: make -C compiler-c
      - name: 全量门禁
        run: ./ci.sh
