# release.yml —— 双阶段发布 workflow(tag 推送触发;spec 工具链分发 §6,计划 2 Task 5)
#
#   Stage 1  prebuilt  固定点基准平台(macos-14)出三件预发射 C
#            natives   四平台 matrix:自举链全链 → 固定点跨平台逐字节 diff(发布承诺)
#                      → release.sh 单平台打包 → tests/dist/accept.sh(§7 第 1-5 项)
#   Stage 2  windows   cc-only 构建预发射 C(绕过 seed,即验源码线 mingw 通路)
#                      → 组装 zip(§2.2)→ tests/dist/accept_windows.sh(§7 第 6-9 项
#                      + P2-2 移交的编码三向/ps1 语法门/rc 矩阵)
#            publish   全绿门(计划 2 Global Constraints:任一平台失败不发版)→
#                      五平台产物 + src + SHA256SUMS + install.sh → GitHub Release
#
# 首跑真验证在用户打 tag 时(runner 标签以当日可用性为准:macos-13 为末代 intel,
# 若届时退役,darwin-x86_64 臂需改交叉编译或摘除,首跑即证伪机制)。本地门禁 =
# YAML 可解析 + accept.sh 对本机打包产物全绿(tests/dist/ 两脚本 sh -n 过)。
name: release
on:
  push:
    tags: ['v*']

jobs:
  prebuilt:
    runs-on: macos-14            # 固定点基准平台
    steps:
      - uses: actions/checkout@v4
      - run: make -C compiler-c && sh compiler/build.sh
      - name: 发射三件预发射 C
        run: |
          mkdir -p prebuilt
          compiler/ctc.sh emit compiler/build/cc_run.ct   prebuilt/ctron-cc.c
          compiler/ctc.sh emit compiler/build/cc_check.ct prebuilt/ctron-chk.c
          compiler/ctc.sh emit compiler/build/cc_emit.ct  prebuilt/ctron-emit.c
      - uses: actions/upload-artifact@v4
        with: { name: prebuilt, path: prebuilt/ }

  natives:
    needs: prebuilt
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       platform: darwin-arm64 }
          # darwin-x86_64 暂缓(v0.0.1):macos-13 runner 已退役排队永不到达;
          # Intel Mac 用户走源码线(prebuilt C 任意平台可编),跨编译方案挂账
          - { os: ubuntu-24.04,   platform: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: prebuilt, path: prebuilt }
      # linux 走 prebuilt 直编(seed 自举在 linux glibc 下内存冲破 runner 上限,
      # 四连确定性 shutdown,编译器线挂账);darwin-arm64 保留全自举链作三线互证
      - name: 构建(自举链或 prebuilt 直编)
        run: |
          if [ -f prebuilt/ctron-cc.c ] && [ "$(uname -s)" = "Linux" ]; then
            mkdir -p compiler/bin
            cc -O2 -w -pthread -o compiler/bin/ctron-cc   prebuilt/ctron-cc.c
            cc -O2 -w -pthread -o compiler/bin/ctron-chk  prebuilt/ctron-chk.c
            cc -O2 -w -pthread -o compiler/bin/ctron-emit prebuilt/ctron-emit.c
            echo "CTRON_FROM_PREBUILT=1" >> "$GITHUB_ENV"
          else
            make -C compiler-c
            sh compiler/native.sh
          fi
      - name: 固定点承诺——本平台发射器再发射与基准逐字节 diff
        run: |
          sh compiler/build.sh
          ./compiler/bin/ctron-emit run compiler/build/cc_run.ct > /tmp/re_emit.c
          cmp /tmp/re_emit.c prebuilt/ctron-cc.c
      - name: 打包 + 验收(解压即用/装机路径/无 cc/负例/help)
        run: |
          VER=${GITHUB_REF_NAME#v}
          sh tools/release.sh "$VER"
          sh tests/dist/accept.sh "dist/ctron-$VER-${{ matrix.platform }}.tar.gz"
          # 收敛上传面至发布载荷:暂存树/prebuilt/逐平台 SHA256SUMS 不入 artifact;
          # src 件以基准平台(darwin-arm64)一份为准,避免四平台同名件合并歧义
          rm -rf dist/ctron "dist/ctron-src-$VER" dist/prebuilt
          rm -f dist/SHA256SUMS
          [ "${{ matrix.platform }}" = "darwin-arm64" ] || rm -f "dist/ctron-$VER-src.tar.gz"
      - uses: actions/upload-artifact@v4
        with: { name: "rel-${{ matrix.platform }}", path: dist/ }

  windows:
    needs: prebuilt
    runs-on: windows-latest
    # 注意块式写法:flow 形 `defaults: { run: { shell: msys2 {0} } }` 因 `{` 为
    # flow 指示符不可解析(任务书原稿的已验缺陷,本处以块式修正)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with: { msystem: MINGW64, update: false, install: 'mingw-w64-x86_64-gcc make git diffutils' }
      - uses: actions/download-artifact@v4
        with: { name: prebuilt, path: prebuilt }
      - name: cc-only 构建(绕过 seed;编译器三件 16MB 栈)
        run: |
          mkdir -p bin
          gcc -O2 -w -pthread -Wno-error=incompatible-pointer-types -Wl,--stack,16777216 -o bin/ctron-cc.exe   prebuilt/ctron-cc.c
          gcc -O2 -w -pthread -Wno-error=incompatible-pointer-types -Wl,--stack,16777216 -o bin/ctron-chk.exe  prebuilt/ctron-chk.c
          gcc -O2 -w -pthread -Wno-error=incompatible-pointer-types -Wl,--stack,16777216 -o bin/ctron-emit.exe prebuilt/ctron-emit.c
      - name: 组装 zip(spec §2.2 布局)
        run: |
          VER=${GITHUB_REF_NAME#v}
          mkdir -p ctron/bin ctron/lib/ctron ctron/share/doc
          cp bin/*.exe ctron/bin/; cp ctc.ps1 ctc.cmd ctron/bin/
          cp -R std ctron/lib/ctron/std
          # share/doc 落地:根 README 优先、compiler/README.md 兜底(与 release.sh 同解析序);
          # 空目录会被 Compress-Archive 丢弃,故必须有件
          cp README.md ctron/share/doc/ 2>/dev/null || cp compiler/README.md ctron/share/doc/ 2>/dev/null || true
          printf '%s %s\n' "$VER" "$(git rev-parse --short HEAD)" > ctron/VERSION
          powershell -Command "Compress-Archive -Path ctron -DestinationPath dist-windows.zip -Force"
      - name: 验收(zip 自证/载荷布局/并发/深递归/CRLF/help conformance/编码三向/ps1 语法门/rc 矩阵)
        # zip 自证 = 脚本 A2 段:Expand-Archive 解包发布物本体,复验同一组布局断言
        run: sh tests/dist/accept_windows.sh
      - uses: actions/upload-artifact@v4
        with: { name: rel-windows-x86_64, path: dist-windows.zip }

  publish:
    needs: [prebuilt, natives, windows]            # 全绿门:任一平台失败不发版
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: rel-*, merge-multiple: true, path: rel }
      - uses: actions/checkout@v4
        # 下游修正(相对任务书):publish job 原 workspace 无 checkout,而 install.sh
        # 不在 rel-* artifact 内,不补 checkout 则下方 cp 无源必挂
      - name: 汇总 + SHA256SUMS
        run: |
          VER=${GITHUB_REF_NAME#v}
          # 网站下载页与 install 一行指向 latest/download/install.sh——发布载荷补齐第八资产;
          # install.sh 无 ctron-$VER 前缀,天然不入下方 sha256sum 校验单(与下载页口径一致:校验单只盖六个版本化载荷)
          cp install.sh rel/
          cd rel
          mv dist-windows.zip ctron-$VER-windows-x86_64.zip
          sha256sum ctron-$VER* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
