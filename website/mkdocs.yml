site_name: Ctron
site_url: https://zturnlibs.github.io/Ctron/
repo_url: https://github.com/ZturnLibs/Ctron
repo_name: ZturnLibs/Ctron
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: 暗色}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: 亮色}
  features:
    - content.code.copy
    - navigation.sections
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Language Spec:
      - Overview: spec/README.md
      - 1 词法与语法: spec/01-lexical-grammar.md
      - 2 名字与模块: spec/02-names-modules.md
      - 3 类型系统: spec/03-types.md
      - 4 表达式与控制流: spec/04-expressions.md
      - 5 错误模型: spec/05-errors.md
      - 6 内存模型: spec/06-memory.md
      - 7 并发: spec/07-concurrency.md
      - 8 效果系统与 comptime: spec/08-effects-comptime.md
      - 9 档位与互操作: spec/09-profiles-ffi.md
      - 10 诊断契约与符合性: spec/10-diagnostics-conformance.md
      - 11 网络: spec/11-net.md
      - 12 数据库: spec/12-db.md
  - Std Reference:
      - Overview: std/README.md
      - config: std/config.md
      - crypto: std/crypto.md
      - csv: std/csv.md
      - enc: std/enc.md
      - fmap: std/fmap.md
      - fs: std/fs.md
      - hash: std/hash.md
      - heap: std/heap.md
      - iter: std/iter.md
      - json: std/json.md
      - log: std/log.md
      - map: std/map.md
      - math: std/math.md
      - ndjson: std/ndjson.md
      - opt: std/opt.md
      - path: std/path.md
      - pb: std/pb.md
      - process: std/process.md
      - rand: std/rand.md
      - set: std/set.md
      - sort: std/sort.md
      - str: std/str.md
      - strconv: std/strconv.md
      - time: std/time.md
      - unicode: std/unicode.md
      - uuid: std/uuid.md
  - Domain Packages:
      - net:
          - Overview: net/README.md
          - net: net/net.md
      - http:
          - Overview: http/README.md
          - client: http/client.md
          - date: http/date.md
          - enc: http/enc.md
          - form: http/form.md
          - message: http/message.md
          - parse: http/parse.md
          - sse: http/sse.md
          - ws: http/ws.md
          - frm_auth: http/frm_auth.md
          - frm_body: http/frm_body.md
          - frm_connect: http/frm_connect.md
          - frm_cors: http/frm_cors.md
          - frm_csrf: http/frm_csrf.md
          - frm_html: http/frm_html.md
          - frm_limit: http/frm_limit.md
          - frm_metrics: http/frm_metrics.md
          - frm_middleware: http/frm_middleware.md
          - frm_openapi: http/frm_openapi.md
          - frm_otlp: http/frm_otlp.md
          - frm_router: http/frm_router.md
          - frm_sechdr: http/frm_sechdr.md
          - frm_serve: http/frm_serve.md
          - frm_static: http/frm_static.md
          - frm_timeout: http/frm_timeout.md
          - frm_trace: http/frm_trace.md
      - tls:
          - Overview: tls/README.md
          - tls: tls/tls.md
      - db:
          - Overview: db/README.md
          - db: db/db.md
          - pg: db/pg.md
          - pool: db/pool.md
          - redis: db/redis.md
          - rowmap: db/rowmap.md
      - ffi:
