site_name: Ctron
site_url: https://zturnlibs.github.io/Ctron/
repo_url: https://github.com/ZturnLibs/Ctron
repo_name: ZturnLibs/Ctron
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: 暗色}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: 亮色}
  features:
    - content.code.copy
    - navigation.sections
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Language Spec:
      - Overview: spec/README.md
      - 1 词法与语法: spec/01-lexical-grammar.md
      - 2 名字与模块: spec/02-names-modules.md
      - 3 类型系统: spec/03-types.md
      - 4 表达式与控制流: spec/04-expressions.md
      - 5 错误模型: spec/05-errors.md
      - 6 内存模型: spec/06-memory.md
      - 7 并发: spec/07-concurrency.md
      - 8 效果系统与 comptime: spec/08-effects-comptime.md
      - 9 档位与互操作: spec/09-profiles-ffi.md
      - 10 诊断契约与符合性: spec/10-diagnostics-conformance.md
      - 11 网络: spec/11-net.md
      - 12 数据库: spec/12-db.md
  - Std Reference:
      - Overview: std/README.md
      - config: std/config.md
      - crypto: std/crypto.md
      - csv: std/csv.md
      - enc: std/enc.md
      - fmap: std/fmap.md
      - fs: std/fs.md
      - hash: std/hash.md
      - heap: std/heap.md
      - iter: std/iter.md
      - json: std/json.md
      - log: std/log.md
      - map: std/map.md
      - math: std/math.md
      - ndjson: std/ndjson.md
      - opt: std/opt.md
      - path: std/path.md
      - pb: std/pb.md
      - process: std/process.md
      - rand: std/rand.md
      - set: std/set.md
      - sort: std/sort.md
      - str: std/str.md
      - strconv: std/strconv.md
      - time: std/time.md
      - unicode: std/unicode.md
      - uuid: std/uuid.md
  - Examples: examples.md
  - Server: server-guide.md
  - Download: download.md
