site_name: Ctron
site_url: https://zturnlibs.github.io/Ctron/
repo_url: https://github.com/ZturnLibs/Ctron
repo_name: ZturnLibs/Ctron
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: 暗色}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: 亮色}
  features:
    - content.code.copy
    - navigation.sections
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Getting Started: 快速开始
            Setup & First Build: 安装与首次构建
            Ten-Minute Tour: 十分钟上手
            Language Spec: 语言规范
            Overview: 总览
            1 Lexical & Grammar: 1 词法与语法
            2 Names & Modules: 2 名字与模块
            3 Type System: 3 类型系统
            4 Expressions & Control Flow: 4 表达式与控制流
            5 Error Model: 5 错误模型
            6 Memory Model: 6 内存模型
            7 Concurrency: 7 并发
            8 Effects & Comptime: 8 效果系统与 comptime
            9 Profiles & Interop: 9 档位与互操作
            10 Diagnostics & Conformance: 10 诊断契约与符合性
            11 Networking: 11 网络
            12 Database Access: 12 数据库
            Std Reference: 标准库参考
            Domain Packages: 域包
            Registry Packages: 注册表包
            Examples: 示例
            Server: 服务器指南
            Agent Guide: Agent 指南
            Download: 下载
